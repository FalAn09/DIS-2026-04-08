version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: app-backend:dev
    container_name: app-backend-dev
    ports:
      - "5000:5000"
    volumes:
      - ./backend/db:/app/db
    environment:
      - FLASK_ENV=development
      - DEBUG_MODE=true
    labels:
      environment: "development"
      branch: "dev"
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: app-frontend:dev
    container_name: app-frontend-dev
    ports:
      - "80:80"
    labels:
      environment: "development"
      branch: "dev"
